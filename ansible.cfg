# Локальный конфиг ansible для dotfiles (обнаруживается из корня репозитория).
# Запуск из корня: nix shell nixpkgs#ansible -c ansible-playbook -i ansible/inventory.yml ansible/site.yml
[defaults]
inventory = ansible/inventory.yml
vars_plugins_enabled = host_group_vars,community.sops.sops

[community.sops]
sops_decryption_order = age
