---
# VPN-серверы. Новый VPS добавляется как новый host-блок.
# Свежий сервер: ansible_port: 22 и ssh_keep_old_port: true,
# после первого прогона сменить ansible_port на ssh_port и ssh_keep_old_port: false.

all:
  children:
    vpn_servers:
      hosts:
        # PRODUCTION FRANCE 45.15.128.162 — DO NOT TOUCH.
        # Не запускать Ansible/SSH, не менять конфиги/сервисы, не перезапускать.
        # Только ручное включение/выключение пользователем после готовности каскада.
#        vpn1:
#          ansible_host: 45.15.128.162
#          ansible_port: 39089
#          ansible_user: root
#          ssh_keep_old_port: false
#          country_code: fr
        vpn2:
          ansible_host: 138.124.84.121
          ansible_port: 57777
          ansible_user: root
          ssh_keep_old_port: false
          country_code: se
          inbound_remark: se-reality-xhttp-443
          fail2ban_ignore_ips: ['62.173.152.18']
    relay_servers:
      hosts:
        ru-relay:
          ansible_host: 62.173.152.18
          ansible_port: 57777
          ansible_user: root
          ssh_port: 57777
          ssh_keep_old_port: false
          relay_backends:
            - {name: se, host: 138.124.84.121, port: 443}
