---
# Оркестрация: harden -> 3x-ui -> remark -> inbound -> links. Теги: harden, xui, inbound, links, always.
# Логика панели/инбаунда — в files/xui_api.py (sqlite + официальный API).

- name: Проверка конфигурации доступа (не зацепить сам себя)
  ansible.builtin.assert:
    that:
      - ssh_keep_old_port | bool or ansible_port | int == ssh_port | int
    msg: >-
      Свежий VPS: ansible_port=22 и ssh_keep_old_port=true.
      После первого прогона: ansible_port={{ ssh_port }} и ssh_keep_old_port=false.

- name: Базовые пакеты
  ansible.builtin.package:
    name: [ufw, fail2ban, python3-bcrypt, curl, openssl]
    state: present
    update_cache: true
  tags: [harden]

- name: Удалить старый 50-hardening.conf (перекрывался cloud-init)
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/50-hardening.conf
    state: absent
  notify: [restart sshd, restart ssh socket]
  tags: [harden]

- name: sshd hardening (validate перед рестартом)
  ansible.builtin.template:
    src: sshd-hardening.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
    # ssh.socket: рестарт обязателен — sshd-socket-generator перегенерирует ListenStream
    # только на daemon-reload; без него сокет слушает старый порт (Ubuntu 24.04)
  notify: [restart sshd, restart ssh socket]
  tags: [harden]

- name: fail2ban jail на SSH
  ansible.builtin.template:
    src: fail2ban-jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    mode: '0644'
  notify: restart fail2ban
  tags: [harden]

- name: Применить hardening до firewall
  ansible.builtin.meta: flush_handlers
  tags: [harden]

- name: ufw — limit на ssh-порт
  community.general.ufw:
    rule: limit
    port: "{{ ssh_port }}"
    proto: tcp
  tags: [harden]

- name: ufw — limit на старый порт (только ротация)
  community.general.ufw:
    rule: limit
    port: "{{ ssh_old_port }}"
    proto: tcp
  when: ssh_keep_old_port | bool
  tags: [harden]

- name: ufw — закрыть старый порт после ротации
  community.general.ufw:
    rule: limit
    port: "{{ ssh_old_port }}"
    proto: tcp
    delete: true
  when: not ssh_keep_old_port | bool
  tags: [harden]

- name: ufw — разрешить порты сервиса
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ allow_tcp_ports }}"
  tags: [harden]

- name: ufw — default deny incoming
  community.general.ufw:
    direction: incoming
    policy: deny
  tags: [harden]

- name: ufw — включить
  community.general.ufw:
    state: enabled
  tags: [harden]

- name: Проверить наличие 3x-ui
  ansible.builtin.stat:
    path: /usr/local/x-ui/x-ui
  register: xui_bin
  tags: [xui]

- name: Скачать install script ({{ xui_version }})
  ansible.builtin.get_url:
    url: "{{ xui_install_script }}"
    dest: /tmp/3xui-install.sh
    mode: '0755'
  when: not xui_bin.stat.exists
  tags: [xui]

- name: Установить 3x-ui
  # needrestart/debconf на свежих ОС поднимает интерактив и зависает без /dev/null-stdin;
  # NEEDRESTART_MODE=a — рестартовать сервисы молча
  ansible.builtin.shell: DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a bash /tmp/3xui-install.sh < /dev/null
  args:
    executable: /bin/bash
  when: not xui_bin.stat.exists
  tags: [xui]

- name: Получить configure output
  ansible.builtin.set_fact:
    xui_cfg:
      server_ip: "{{ ansible_host }}"
      link_host: "{{ link_host | default(ansible_host) }}"
      link_port: "{{ link_port | default(inbound_port) }}"
      panel_port: "{{ panel_port }}"
      panel_basepath: "{{ panel_basepath }}"
      panel_user: "{{ panel_user }}"
      panel_password: "{{ panel_password }}"
      sni_target: "{{ sni_target }}"
      reality_public_key: "{{ reality_public_key }}"
      reality_private_key: "{{ reality_private_key }}"
      reality_fingerprint: "{{ reality_fingerprint }}"
      reality_short_ids: "{{ reality_short_ids }}"
      spider_x: "{{ spider_x }}"
      xhttp_path: "{{ xhttp_path }}"
      inbound_remark: "{{ inbound_remark }}"
      inbound_port: "{{ inbound_port }}"
      clients: "{{ clients }}"
      country_code: "{{ country_code }}"
  tags: [xui, inbound, links]

- name: Helper роли на сервер
  ansible.builtin.copy:
    src: xui_api.py
    dest: /usr/local/share/xui_helper.py
    owner: root
    mode: '0750'
  tags: [xui, inbound, links]

- name: Конфиг helper'а
  ansible.builtin.copy:
    content: "{{ xui_cfg | to_json }}"
    dest: /tmp/xui_vars.json
    owner: root
    mode: '0600'
  tags: [xui, inbound, links]

- name: Настроить панель (порт, путь, слушатель, админ)
  ansible.builtin.command:
    argv: [/usr/bin/python3, /usr/local/share/xui_helper.py, configure]
  register: configure_out
  changed_when: "'changed:' in configure_out.stdout"
  tags: [xui]

- name: Служба x-ui активна
  ansible.builtin.systemd_service:
    name: x-ui
    enabled: true
    state: started
  tags: [xui]

- name: Синхронизировать remark инбаунда (префикс страны в QR)
  ansible.builtin.command:
    argv: [/usr/bin/python3, /usr/local/share/xui_helper.py, remark]
  register: remark_out
  changed_when: "'changed:' in remark_out.stdout"
  tags: [inbound, links]

- name: Пересоздать инбаунд с текущими клиентами (xui_recreate_inbound=true)
  ansible.builtin.command:
    argv: [/usr/bin/python3, /usr/local/share/xui_helper.py, recreate]
  when: xui_recreate_inbound | default(false) | bool
  register: recreate_out
  changed_when: "'deleted' in recreate_out.stdout or 'created' in recreate_out.stdout"
  tags: [inbound]

- name: Создать/нормализовать инбаунд + клиенты (с asserts)
  ansible.builtin.command:
    argv: [/usr/bin/python3, /usr/local/share/xui_helper.py, inbound]
  register: inbound_out
  changed_when: "'fixed:' in inbound_out.stdout or 'created' in inbound_out.stdout"
  tags: [inbound]

- name: Проверка маски — сертификат SNI-таргета
  ansible.builtin.shell: |
    set -e; echo | openssl s_client -connect {{ ansible_host }}:443 \
    -servername {{ sni_target }} 2>/dev/null \
    | openssl x509 -noout -subject 2>/dev/null | grep -qi '{{ sni_target }}'
  changed_when: false
  tags: [inbound]

- name: Собрать канонические ссылки
  ansible.builtin.command:
    argv: [/usr/bin/python3, /usr/local/share/xui_helper.py, links]
  changed_when: false
  tags: [links]

- name: Забрать {{ links_file_name }}
  ansible.builtin.fetch:
    src: /tmp/xui_links.txt
    dest: "{{ links_local_dir }}/{{ links_file_name }}"
    flat: true
    mode: '0600'
  tags: [links]

- name: Сводка доступа
  ansible.builtin.debug:
    msg:
      - "Панель: ssh -L 8080:127.0.0.1:{{ panel_port }} -p {{ ansible_port }} {{ ansible_user }}@{{ ansible_host }}"
      - "URL: http://localhost:8080{{ panel_basepath }}"
      - "Ссылки: {{ links_local_dir }}/{{ links_file_name }} (QR — из панели в туннеле)"
  tags: [links]
