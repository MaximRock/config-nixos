---
- name: restart sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted

- name: restart ssh socket
  # перечитать drop-in от sshd-socket-generator (регенерируется на daemon-reload)
  ansible.builtin.systemd_service:
    name: ssh.socket
    state: restarted
    daemon_reload: true

- name: restart fail2ban
  ansible.builtin.systemd_service:
    name: fail2ban
    state: restarted
