# Noctalia v5 — конфиг десктоп-шелла.
# ~/.config/noctalia/settings.toml — симлинк на этот файл (см. modules/home/wm/niri/default.nix).
# ВАЖНО: этот файл — базовый слой; GUI-правки падают в ~/.local/state/noctalia/settings.toml,
# который грузится последним и побеждает этот. Удалять через Settings → GUI, не через правку здесь.

[wallpaper]
enabled = true
fill_mode = "crop"

[wallpaper.default]
path = "/home/max/.dotfiles/modules/home/wm/niri/wallpapers/golden-domes.png"

# Размытая подложка обоев выключена: прозрачный wezterm должен показывать
# резкие обои, а не синеватый blur-фон (overview остаётся без backdrop).
[backdrop]
enabled = false

# Заставка «матрица» (neo) при простое; выход по клавише/движению мыши, без пароля
[idle]
behavior_order = ["matrix"]
pre_action_fade_seconds = 0

[idle.behavior.matrix]
timeout = 120
action = "command"
command = "setsid -f foot -a matrix-saver -F -e neo"
resume_command = "pkill -x neo"

# Экранная блокировка паролем выключена полностью (в т.ч. при засыпании/крышке)
[lockscreen]
enabled = false

# Яркость внешнего монитора по DDC/CI (ddcutil из systemPackages; нужен hardware.i2c.enable)
[brightness]
enable_ddcutil = true

# Индикатор раскладки клавиатуры (us/ru); клик по виджету переключает раскладку
[bar.default]
end = ["keyboard_layout", "media", "tray", "notifications", "clipboard",
       "network", "bluetooth", "volume", "brightness", "battery",
       "control-center", "session"]

# Уведомления: Noctalia владеет D-Bus-именем org.freedesktop.Notifications.
# dunst выключен (home/common/default.nix), иначе DunstService перехватит имя первым.
[notification]
enable_daemon = true
position = "top_right"
max_visible = 4
history_retention_hours = 168 # не хранить историю старше недели

[widget.keyboard_layout]
display = "short"
show_glyph = true
show_label = true
hide_when_single_layout = false
